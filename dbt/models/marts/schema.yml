version: 2

models:
  - name: fct_demand_weather
    description: "Hourly fact table joining load, wind/solar generation, day-ahead price, and weather per zone."
    columns:
      - name: row_key
        description: "Surrogate key: zone + timestamp. Must be unique -- a duplicate here means one of the joins (generation/price/weather) is fanning out, most likely generation_pivot not being grouped down to one row per (zone, ts)."
        tests: [unique, not_null]
      - name: zone
        tests: [not_null]
      - name: ts
        tests: [not_null]
      - name: load_mw
        tests: [not_null]

  - name: forecasts_vs_actuals
    description: "Resolved predictions (i.e. the target hour has actually happened) joined against real values, with error metrics. Rows only exist once an actual has arrived -- a still-future prediction simply isn't here yet, not a null row."
    columns:
      - name: zone
        tests: [not_null]
      - name: ts
        tests: [not_null]
      - name: target
        tests:
          - accepted_values:
              values: ['demand', 'wind_generation', 'solar_generation']
      - name: predicted_value
        tests: [not_null]
      - name: actual_value
        tests: [not_null]

  - name: daily_energy_balance
    description: "Observed energy, peak load and hourly coverage per zone and UTC day. Totals may be partial."

  - name: hourly_generation_by_type
    description: "Observed generation in MW per zone, hour and ENTSO-E production type."

  - name: daily_forecast_performance
    description: "MAE, signed bias and evaluation count per zone, UTC target day, target and model version."

  - name: source_coverage
    description: "Latest available observation and coverage of the last 24 completed hours per observed zone and source."
