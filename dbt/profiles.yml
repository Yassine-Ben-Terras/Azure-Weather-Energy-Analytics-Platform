energy_weather:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: public
      threads: 4
      sslmode: "{{ env_var('WAREHOUSE_SSLMODE', 'verify-full') }}"
      sslrootcert: "{{ env_var('WAREHOUSE_SSLROOTCERT', '/etc/ssl/certs/ca-certificates.crt') }}"
