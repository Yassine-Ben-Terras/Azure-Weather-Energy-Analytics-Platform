name: CD
on:
  workflow_dispatch:
    inputs:
      maintenance_ready:
        description: 'Airflow DAG is paused; no running or queued DAG runs/tasks remain'
        required: true
        type: boolean
        default: false
      schema_compatible:
        description: 'Release requires no database migration and preserves existing schema compatibility'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: azure-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.maintenance_ready && inputs.schema_compatible
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      APP_PREFIX: ${{ vars.APP_PREFIX }}
      RELEASE_TAG: git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI for this exact main commit
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha,
              branch: 'main', event: 'push', per_page: 100
            });
            const latest = runs.sort((a, b) => b.run_number - a.run_number)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              core.setFailed('The latest CI run for this exact main commit must have succeeded.');
            }
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in CLIENT_ID TENANT_ID SUBSCRIPTION_ID AZURE_RESOURCE_GROUP ACR_NAME APP_PREFIX; do
            test -n "${!key}" || { echo "Missing environment variable: $key"; exit 1; }
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Build and push images
        run: |
          set -euo pipefail
          registry=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker build -t "$registry/airflow:$RELEASE_TAG" -f airflow/Dockerfile .
          docker build -t "$registry/api:$RELEASE_TAG" -f api/Dockerfile .
          docker push "$registry/airflow:$RELEASE_TAG"
          docker push "$registry/api:$RELEASE_TAG"
          for repository in airflow api; do
            digest=$(az acr repository show --name "$ACR_NAME" --image "$repository:$RELEASE_TAG" --query digest -o tsv)
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            echo "${repository^^}_IMAGE=$registry/$repository@$digest" >> "$GITHUB_ENV"
          done
      - name: Roll out digest-pinned workloads
        run: python scripts/deploy_release.py
      - name: Preserve previous and requested images for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-record.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Release instructions
        if: success()
        run: |
          echo '### Deployment completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Container Apps health checks passed. Check private API readiness, DAG import and source freshness from an authorized network before manually resuming Airflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Airflow remains paused. No migrations or automatic rollback were executed.' >> "$GITHUB_STEP_SUMMARY"
